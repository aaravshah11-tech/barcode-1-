<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SENTINEL emblem options</title>
<style>
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../../vendor/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../../vendor/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("../../vendor/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
body { margin: 0; background: #070B12; color: #E6ECF3; font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; padding: 40px; }
h1 { font-weight: 400; font-size: 20px; letter-spacing: .02em; margin: 0 0 4px; }
p.sub { color: #9AA8B8; margin: 0 0 32px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.opt { background: rgba(20,30,46,.55); border: 1px solid rgba(140,170,210,.10); border-radius: 4px; padding: 28px; }
.label { font: 11px "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #9AA8B8; }
.big { display: grid; place-items: center; height: 220px; color: #C8D3E0; }
.big svg { width: 150px; height: 150px; }
.sizes { display: flex; gap: 22px; align-items: center; margin: 14px 0 18px; color: #C8D3E0; }
.lockup { display: flex; gap: 12px; align-items: center; border-top: 1px solid rgba(140,170,210,.10); padding-top: 18px; color: #C8D3E0; }
.lockup b { font-weight: 600; letter-spacing: .28em; font-size: 15px; color: #E6ECF3; }
h2 { font-weight: 600; font-size: 15px; margin: 6px 0 4px; }
.why { color: #9AA8B8; font-size: 13px; }
</style></head><body>
<h1>SENTINEL — emblem options</h1><p class="sub">Single colour, hairline weight, built on a thin circle. Shown large, at 32 / 24 / 16 px, and as a lockup.</p>
<div class="grid">
<script>
const marks = {
  A: { name: 'Aperture', why: 'An abstract eye: two arcs and a pupil. Watchful, calm, reads instantly at 16 px.', svg: (w) => `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"><circle cx="32" cy="32" r="29"/><path d="M12 32c6-9 13-13.5 20-13.5S46 23 52 32c-6 9-13 13.5-20 13.5S18 41 12 32z"/><circle cx="32" cy="32" r="5.5" fill="currentColor" stroke="none"/></svg>` },
  B: { name: 'Beam', why: 'A lighthouse beam sweeping from a base point — the house keeping watch. Most distinctive; slightly busier at 16 px.', svg: (w) => `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="29"/><path d="M32 46 L14 22 M32 46 L50 22"/><path d="M14 22 A 25 25 0 0 1 50 22" stroke-dasharray="2 3.2"/><circle cx="32" cy="46" r="3" fill="currentColor" stroke="none"/></svg>` },
  C: { name: 'Meridian', why: 'A reticle with a broken ring and a single bearing mark. Instrument-like and very clean; the most "government system".', svg: (w) => `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"><path d="M32 3 A29 29 0 1 1 3 32"/><path d="M32 3v10M61 32H51M32 61V51"/><circle cx="32" cy="32" r="11"/><circle cx="32" cy="32" r="2.5" fill="currentColor" stroke="none"/></svg>` },
};
for (const [k, m] of Object.entries(marks)) document.write(`<div class="opt"><span class="label">Option ${k}</span><h2>${m.name}</h2><div class="why">${m.why}</div>
  <div class="big">${m.svg(1.4)}</div>
  <div class="sizes"><span style="width:32px">${m.svg(2.4)}</span><span style="width:24px">${m.svg(2.8)}</span><span style="width:16px">${m.svg(3.6)}</span><span class="label">32 · 24 · 16</span></div>
  <div class="lockup"><span style="width:26px">${m.svg(2.6)}</span><b>SENTINEL</b></div></div>`);
</script>
</div></body></html>
