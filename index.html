<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HomeBase</title>
  <meta name="description" content="Your home toolkit: library, inventory, sports stats, match photography and golf swing analysis. Phone and computer in sync.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HomeBase">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/tools.css">
  <script>
    try {
      var t = localStorage.getItem('hb.theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t;
      if (localStorage.getItem('hb.contrast') === 'high') document.documentElement.dataset.contrast = 'high';
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view" onclick="event.preventDefault();document.getElementById('view').focus()">Skip to content</a>
  <div class="app" id="app">
    <header class="topbar">
      <a href="#/" class="home-btn" id="home-btn" aria-label="Back to the menu" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>
      </a>
      <a href="#/" class="brand" id="brand">
        <span class="brand-icon" id="brand-icon"><img src="icons/icon.svg" alt="" width="28" height="28"></span>
        <span id="brand-name">HomeBase</span>
      </a>
      <div class="topbar-pills">
        <span id="offline-pill" class="pill pill-warn" hidden>Offline</span>
        <a id="sync-pill" class="pill" href="#/settings/pair" hidden></a>
        <button id="contrast-btn" class="icon-btn" type="button" aria-label="Outdoor high-contrast mode" title="Outdoor high-contrast mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>
    <nav class="tabbar" id="tabbar" aria-label="Tool sections" hidden></nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>HomeBase needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
