<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=(localStorage.getItem("sentinel.theme")==="navy"?"navy":"graphite")}catch(e){document.documentElement.dataset.theme="graphite"}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SENTINEL Agent">
<title>SENTINEL // Agent</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="./agent.css">
</head>
<body>
<div class="banner-active" data-banner role="status" aria-live="polite" hidden></div>
<main class="agent-main" id="main"></main>
<div class="dim oled" data-dim hidden aria-label="Standby screen. Tap to wake."><div class="oled-box">
  <div class="oled-top"><span class="oled-emblem" aria-hidden="true"><svg viewBox="0 0 64 64" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="32" cy="32" r="22"/><circle cx="32" cy="32" r="4"/><path d="M32 4v14M32 46v14M4 32h14M46 32h14"/></svg></span><b data-ocode></b></div>
  <div class="oled-mission mono" data-omission></div>
  <div class="oled-state"><span class="oled-dot"></span><span data-ostate></span></div>
  <div class="oled-clock mono" data-oclock></div>
  <div class="oled-meta mono"><span>BATT <b data-obatt></b></span><span>SIG <b data-osignal></b></span></div>
  <div class="oled-meta mono" data-olast></div>
  <div class="oled-hint">Tap to wake</div></div></div>
<div class="find" data-find hidden><div class="find-text mono">HERE<br><span data-findname></span></div></div>
<script type="module" src="./agent.js"></script>
</body>
</html>
