name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev tools
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Offline file list is up to date
        run: |
          npm run sw
          git diff --exit-code sw.js || (echo "::error::sw.js is out of date - run 'npm run sw' and commit it" && exit 1)

      - name: Browser tests
        run: npm run test:e2e
        env:
          SHOTS: ${{ runner.temp }}/shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7
